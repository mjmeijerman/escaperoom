<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PC Doctor — 3D Escape Room</title>
<style>
  :root{
    --ink:#e7e9ea; --dim:#9aa1a6; --accent:#59d3ff; --ok:#63d68b; --bad:#ff6b5a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:#07090a;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  canvas#scene{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.62) 100%)}
  kbd{font-family:var(--mono);font-size:.74em;border:1px solid rgba(231,233,234,.4);border-bottom-width:2px;
    border-radius:3px;padding:.06em .38em;margin-right:.4em;color:#fff;background:rgba(0,0,0,.35)}

  /* ---------- hud: crosshair, prompt, timer. nothing else ---------- */
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none}
  #crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
    border:1px solid rgba(240,244,246,.6);background:rgba(0,0,0,.25);
    transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}
  #crosshair.hot{background:var(--accent);border-color:#dffaff;transform:scale(1.5);box-shadow:0 0 12px rgba(89,211,255,.9)}
  #crosshair.grab{border-radius:2px;border-color:#ffd166;background:#ffd166;transform:scale(1.2) rotate(45deg)}
  #prompt.read{border-color:rgba(255,255,255,.14);color:#a9b6bc;font-style:italic}
  #prompt{position:absolute;left:50%;top:calc(50% + 36px);transform:translateX(-50%);white-space:nowrap;
    font-family:var(--mono);font-size:.78rem;letter-spacing:.03em;padding:.34em .72em;border-radius:3px;
    background:rgba(8,11,13,.82);border:1px solid rgba(89,211,255,.3);color:#dff6ff;backdrop-filter:blur(3px)}
  .topbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
    padding:12px 18px;font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
    color:#8b979e;background:linear-gradient(180deg,rgba(5,7,8,.8),rgba(5,7,8,0))}
  .brand{display:flex;align-items:center;gap:.6em;color:#c9d3d8}
  .brand i{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid rgba(89,211,255,.45);
    color:var(--accent);font-style:normal;font-size:.8rem}
  .timer{font-variant-numeric:tabular-nums;color:#b9c4c9}

  /* ---------- tray: reading surface, corner only ---------- */
  #tray{position:fixed;left:16px;bottom:16px;z-index:6;width:min(330px,32vw);padding:11px 13px;
    background:linear-gradient(180deg,rgba(12,16,18,.9),rgba(7,10,11,.94));
    border:1px solid rgba(89,211,255,.22);border-left:2px solid rgba(89,211,255,.55);
    box-shadow:0 16px 44px rgba(0,0,0,.6);font-family:var(--mono);font-size:.76rem;line-height:1.55}
  #tray .head{display:flex;align-items:baseline;gap:.5em;margin-bottom:.4em;flex-wrap:wrap}
  #tray .head b{font-size:.84rem;font-weight:600;letter-spacing:.02em;color:#eaf6fa}
  #tray .head span{font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:#6e7d85}
  #tray p{margin:.35em 0;color:#c2ced4}
  #tray p b{color:#fff}
  #tray .keys{margin-top:.5em;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:#6b7a82}
  #tray table{border-collapse:collapse;margin-top:.4em;width:100%}
  #tray td{padding:1px 0;vertical-align:top;color:#c2ced4}
  #tray td.c{color:var(--accent);padding-right:.7em;white-space:nowrap;font-weight:600}
  #tray .got{color:var(--ok)}
  #tray .bar{height:4px;background:rgba(255,255,255,.1);margin-top:.5em;border-radius:2px;overflow:hidden}
  #tray .bar i{display:block;height:100%;background:var(--accent);width:0}
  #tray .sub{color:#8b979e;font-size:.7rem}
  #tray .say{color:#ffe9b3}

  /* ---------- notepad: inventory + notes ---------- */
  #pad{position:fixed;right:16px;top:60px;z-index:8;width:min(320px,34vw);padding:13px 15px;
    background:repeating-linear-gradient(180deg,rgba(24,30,33,.96) 0 21px,rgba(30,38,42,.96) 21px 22px);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.65);
    font-family:var(--mono);font-size:.74rem;line-height:22px;color:#dfe7ea}
  #pad h2{margin:0 0 6px;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:#7f8d94;font-weight:600}
  #pad .items{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px;min-height:22px}
  #pad .items span{border:1px solid rgba(89,211,255,.35);color:#cbeefb;padding:0 .4em;font-size:.68rem}
  #pad .items em{color:#5c6a71;font-style:normal;font-size:.68rem}
  #pad ul{list-style:none;margin:0;padding:0}
  #pad li{display:flex;justify-content:space-between;gap:.6em}
  #pad li b{color:#ffd166;font-weight:600}
  #pad li i{font-style:normal;color:#8b979e}

  /* ---------- the key legend: always on, bottom right, small ---------- */
  #legend{position:fixed;right:16px;bottom:16px;z-index:6;display:flex;flex-wrap:wrap;gap:.3em 1em;
    max-width:min(360px,50vw);padding:8px 11px;background:rgba(7,10,11,.60);
    border:1px solid rgba(255,255,255,.10);font-family:var(--mono);font-size:.58rem;letter-spacing:.09em;
    text-transform:uppercase;color:#7f8d94;line-height:1.6;pointer-events:none;backdrop-filter:blur(3px)}
  #legend b{color:#cfe3ea;font-weight:600;letter-spacing:.06em}
  @media (max-width:820px){ #legend{font-size:.5rem;max-width:62vw;gap:.2em .7em} }

  #banner{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:9;text-align:center;
    padding:9px 20px;background:rgba(8,12,14,.86);border:1px solid rgba(89,211,255,.45);color:#e7f8ff;
    letter-spacing:.16em;text-transform:uppercase;font-family:var(--mono);font-size:.8rem}
  #banner small{display:block;margin-top:.45em;font-size:.6rem;letter-spacing:.12em;color:#8b979e;text-transform:none}

  .toasts{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:40;display:grid;gap:7px;
    justify-items:center;pointer-events:none;width:min(520px,90vw)}
  .toast{padding:.5em 1em;background:rgba(9,13,15,.94);border:1px solid rgba(89,211,255,.4);color:#dff2f8;
    font-family:var(--mono);font-size:.76rem;animation:tin .2s ease-out;text-align:center}
  .toast.bad{border-color:rgba(255,107,90,.6);color:#ffcfc8}
  .toast.good{border-color:rgba(99,214,139,.6);color:#c8f5d8}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  #unlockHint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:6;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#9aa1a6;
    background:rgba(6,9,10,.7);border:1px solid rgba(255,255,255,.15);padding:.45em .85em;pointer-events:none}
  #bloom{position:fixed;inset:0;z-index:30;background:#eafcff;opacity:0;pointer-events:none;
    transition:opacity .28s ease-out}
  @media (max-width:820px){
    #tray{width:min(300px,60vw)}
    #pad{width:min(280px,52vw)}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div id="hud">
  <div class="topbar">
    <div class="brand"><i>⌘</i>PC Doctor</div>
    <div class="timer" id="timer">00:00</div>
  </div>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="prompt" hidden></div>
</div>

<aside id="tray" hidden><div class="head"><span id="kicker"></span><b id="title"></b></div>
  <div id="body"></div><div class="keys" id="keys"></div></aside>

<aside id="pad" hidden><h2>workshop notepad</h2>
  <div class="items" id="padItems"></div>
  <h2>fault codes</h2>
  <ul id="padCodes"></ul>
  <h2>found</h2>
  <ul id="padNotes"></ul>
</aside>

<aside id="legend" aria-label="controls">
  <span><b>W A S D</b> walk</span>
  <span><b>Shift</b> hurry</span>
  <span><b>Space</b> jump</span>
  <span><b>E</b> use</span>
  <span><b>Q</b> let go</span>
  <span><b>I</b> notepad</span>
  <span><b>H</b> hint</span>
  <span><b>M</b> music</span>
  <span><b>N</b> all sound</span>
  <span><b>Esc</b> free cursor</span>
  <span><b>click</b> look</span>
</aside>

<div id="banner" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="unlockHint">Click to look around</div>
<div id="bloom"></div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';

/* ----------------------------------------------------------------- setup */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = s => document.querySelector(s);
const canvas = $('#scene');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b0c);
scene.fog = new THREE.FogExp2(0x0c1012, 0.026);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 60);
camera.rotation.order = 'YXZ';

/* two scales, four numbers (see PC-DOCTOR.md §2) */
const HUMAN  = { eye: 1.62, speed: 2.45, jump: 3.1, near: 0.05, reach: 2.3, step: 0.34, foot: 2.6 };
const SHRUNK = { eye: 0.017, speed: 0.105, jump: 0.36, near: 0.0004, reach: 0.13, step: 0.004, foot: 0.055 };
let P = HUMAN;

/* -------------------------------------------------------------- textures */
function tex(w, h, draw, opt = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (opt.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(opt.rx || 1, opt.ry || 1);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function grain(g, w, h, a = .05) {
  for (let i = 0; i < (w * h) / 140; i++) {
    const v = Math.random() < .5 ? 0 : 255;
    g.fillStyle = `rgba(${v},${v},${v},${Math.random() * a})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}

const floorTex = tex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#2a2c2d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? 10 : 120},${Math.random() < .5 ? 12 : 122},${Math.random() < .5 ? 14 : 120},${Math.random() * .06})`;
    g.fillRect(Math.random() * w, Math.random() * h, rnd(2, 16), rnd(2, 12));
  }
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke();
    g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke();
  }
  grain(g, w, h, .05);
}, { rx: 2, ry: 2 });

const wallTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#43484a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 420; i++) {
    const v = Math.random() < .5 ? 26 : 176;
    g.fillStyle = `rgba(${v},${v + 2},${v + 3},${Math.random() * .035})`;
    g.fillRect(Math.random() * w, Math.random() * h, rnd(6, 46), rnd(4, 30));
  }
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = `rgba(0,0,0,${rnd(.05, .16)})`; g.lineWidth = rnd(.5, 2);
    g.beginPath();
    const x = rnd(0, w), y = rnd(0, h);
    g.moveTo(x, y); g.lineTo(x + rnd(-30, 30), y + rnd(20, 70)); g.stroke();
  }
  grain(g, w, h, .04);
}, { rx: 2, ry: 1 });

const benchTex = tex(1024, 512, (g, w, h) => {
  g.fillStyle = '#4a3323'; g.fillRect(0, 0, w, h);
  for (let p = 0; p < 4; p++) {
    const y = p * h / 4;
    g.fillStyle = `rgb(${68 + rnd(-8, 8)},${46 + rnd(-6, 6)},${30 + rnd(-5, 5)})`;
    g.fillRect(0, y + 2, w, h / 4 - 4);
    for (let i = 0; i < 90; i++) {
      g.strokeStyle = `rgba(${20 + Math.random() * 50},${12 + Math.random() * 34},${8 + Math.random() * 22},${.1 + Math.random() * .3})`;
      g.lineWidth = rnd(.4, 2.2);
      g.beginPath();
      const yy = y + rnd(0, h / 4);
      for (let x = 0; x <= w; x += 20) g.lineTo(x, yy + Math.sin((x + i * 9) * .02) * 2.5);
      g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, y + h / 4 - 3, w, 3);
  }
  for (let i = 0; i < 40; i++) {           // cup rings and scars
    g.strokeStyle = `rgba(20,12,6,${rnd(.1, .28)})`; g.lineWidth = rnd(1, 3);
    const x = rnd(0, w), y = rnd(0, h), r2 = rnd(8, 30);
    g.beginPath(); g.arc(x, y, r2, 0, 6.3); g.stroke();
  }
  grain(g, w, h, .05);
}, { rx: 2, ry: 1 });

const pcbTex = tex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#0c3b2c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? 4 : 60},${Math.random() < .5 ? 20 : 150},${Math.random() < .5 ? 12 : 110},${Math.random() * .07})`;
    g.fillRect(Math.random() * w, Math.random() * h, rnd(2, 20), rnd(2, 20));
  }
  // traces
  g.strokeStyle = 'rgba(150,200,150,.16)'; g.lineWidth = 2;
  for (let i = 0; i < 190; i++) {
    let x = Math.round(rnd(0, w) / 16) * 16, y = Math.round(rnd(0, h) / 16) * 16;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 5; k++) {
      if (Math.random() < .5) x += rnd(-90, 90); else y += rnd(-90, 90);
      g.lineTo(x, y);
    }
    g.stroke();
  }
  // pads and vias
  for (let i = 0; i < 420; i++) {
    const x = rnd(0, w), y = rnd(0, h);
    g.fillStyle = 'rgba(200,190,120,.5)';
    g.beginPath(); g.arc(x, y, rnd(2, 5), 0, 6.3); g.fill();
    g.fillStyle = 'rgba(10,20,16,.85)';
    g.beginPath(); g.arc(x, y, rnd(1, 2.4), 0, 6.3); g.fill();
  }
  g.fillStyle = 'rgba(225,230,220,.5)';
  g.font = '600 26px ' + 'ui-monospace,monospace';
  g.fillText('PD-B450M  REV 2.1', 40, 60);
  g.fillText('CPU_FAN   SYS_FAN3', 40, h - 40);
  grain(g, w, h, .05);
});

const paperTex = tex(512, 640, (g, w, h) => {
  g.fillStyle = '#e6e2d6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 300; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? 120 : 255},${Math.random() < .5 ? 120 : 250},${Math.random() < .5 ? 110 : 235},${Math.random() * .1})`;
    g.fillRect(Math.random() * w, Math.random() * h, rnd(2, 22), rnd(2, 10));
  }
  g.strokeStyle = 'rgba(90,110,150,.28)'; g.lineWidth = 1;
  for (let y = 120; y < h - 40; y += 26) { g.beginPath(); g.moveTo(28, y); g.lineTo(w - 28, y); g.stroke(); }
  g.strokeStyle = 'rgba(190,90,80,.5)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(46, 60); g.lineTo(46, h - 30); g.stroke();
});

const metalTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#24282b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? 8 : 170},${Math.random() < .5 ? 10 : 175},${Math.random() < .5 ? 12 : 180},${Math.random() * .05})`;
    g.fillRect(Math.random() * w, Math.random() * h, rnd(1, 30), rnd(1, 3));
  }
  grain(g, w, h, .04);
}, { rx: 2, ry: 2 });

const shadowTex = tex(256, 256, (g, S) => {
  const grd = g.createRadialGradient(S / 2, S / 2, 4, S / 2, S / 2, S / 2);
  grd.addColorStop(0, 'rgba(0,0,0,.66)');
  grd.addColorStop(.55, 'rgba(0,0,0,.3)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
});

/* sticker: the shop sign, the generator procedure, the POST table on the manual */
function stickerTex(lines, opt = {}) {
  return tex(512, opt.h || 384, (g, w, h) => {
    g.fillStyle = opt.bg || '#efe9d8'; g.fillRect(0, 0, w, h);
    if (opt.border !== false) { g.strokeStyle = opt.ink || '#1b2328'; g.lineWidth = 8; g.strokeRect(10, 10, w - 20, h - 20); }
    g.fillStyle = opt.ink || '#1b2328';
    g.textAlign = opt.align || 'left';
    const x = opt.align === 'center' ? w / 2 : 34;
    let y = opt.top || 78;
    for (const [text, size, bold] of lines) {
      g.font = `${bold ? '700' : '500'} ${size}px ui-monospace,Menlo,Consolas,monospace`;
      g.fillText(text, x, y);
      y += size * 1.42;
    }
    grain(g, w, h, .05);
  });
}

const slotMatBlue = new THREE.MeshStandardMaterial({ color: 0x2f6fd0, roughness: .6 });
const slotMatGrey = new THREE.MeshStandardMaterial({ color: 0x2b2f33, roughness: .6 });

const M = {
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: .93 }),
  wall: new THREE.MeshStandardMaterial({ map: wallTex, roughness: .95 }),
  ceiling: new THREE.MeshStandardMaterial({ color: 0x24282a, roughness: .96 }),
  bench: new THREE.MeshStandardMaterial({ map: benchTex, roughness: .82 }),
  metal: new THREE.MeshStandardMaterial({ map: metalTex, roughness: .62, metalness: .10 }),
  caseInner: new THREE.MeshStandardMaterial({ color: 0x3c4448, roughness: .88, metalness: .04 }),
  metalDark: new THREE.MeshStandardMaterial({ color: 0x1a1e21, roughness: .6, metalness: .5 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x14181a, roughness: .9 }),
  black: new THREE.MeshStandardMaterial({ color: 0x0b0e10, roughness: .85 }),
  pcb: new THREE.MeshStandardMaterial({ map: pcbTex, roughness: .72, metalness: .12 }),
  paper: new THREE.MeshStandardMaterial({ map: paperTex, roughness: .95 }),
  white: new THREE.MeshStandardMaterial({ color: 0xd9d5c8, roughness: .8 }),
  clip: new THREE.MeshStandardMaterial({ color: 0x8f948f, roughness: .75 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xb99545, roughness: .35, metalness: .8 }),
  plastic: new THREE.MeshStandardMaterial({ color: 0x2a3033, roughness: .55 }),
  red: new THREE.MeshStandardMaterial({ color: 0x8c2f24, roughness: .6 }),
};

function box(w, h, d, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  (parent || scene).add(m);
  return m;
}
function plane(w, h, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  (parent || scene).add(m);
  return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  (parent || scene).add(m);
  return m;
}
function sphere(r, mat, x, y, z, parent, seg = 14) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg / 2)), mat);
  m.position.set(x, y, z);
  (parent || scene).add(m);
  return m;
}
function decal(w, h, t, x, y, z, ry = 0, parent) {
  const m = plane(w, h, new THREE.MeshStandardMaterial({ map: t, roughness: .9 }), x, y, z, parent);
  m.rotation.y = ry;
  return m;
}
function shadow(x, z, size = 1, y = 0.008, opacity = .55) {
  const m = plane(size, size, new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity, depthWrite: false }), x, y, z);
  m.rotation.x = -Math.PI / 2;
  return m;
}

/* ----------------------------------------------------------------- audio */
/* everything synthesised: no files, no network (see PC-DOCTOR.md §11) */
const A = { ctx: null, master: null, bus: null, music: null, on: false, muted: false, musicOn: true, hum: null, pad: [], chord: -1 };

function noiseBuf(dur = 2) {
  const b = A.ctx.createBuffer(1, Math.floor(A.ctx.sampleRate * dur), A.ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function audioInit() {
  if (A.ctx) return;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  const ctx = A.ctx = new C();
  A.master = ctx.createGain(); A.master.gain.value = .85; A.master.connect(ctx.destination);
  A.bus = ctx.createGain(); A.bus.gain.value = .9; A.bus.connect(A.master);
  A.music = ctx.createGain(); A.music.gain.value = .35; A.music.connect(A.master);
  // a short procedural room: noise with an exponential decay, no impulse files
  const ir = ctx.createBuffer(2, Math.floor(ctx.sampleRate * 1.1), ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.4);
  }
  A.verb = ctx.createConvolver(); A.verb.buffer = ir;
  A.verbGain = ctx.createGain(); A.verbGain.gain.value = .22;
  A.verb.connect(A.verbGain); A.verbGain.connect(A.master);
  A.noise = noiseBuf(2);
  A.on = true;
  A.bus.connect(A.verb);
  startMusic();
  buildHum();
  loadVoices();
  // a browser that was not really happy about autoplay gets nudged
  if (ctx.state === 'suspended') ctx.resume();
}
function tone({ f = 440, f2 = null, type = 'sine', dur = .18, vol = .12, at = 0, pan = 0, filter = 0 }) {
  if (!A.on) return;
  const t0 = A.ctx.currentTime + at;
  const osc = A.ctx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(f, t0);
  if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(18, f2), t0 + dur);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + Math.min(.015, dur * .25));
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  let head = osc;
  if (filter) {
    const lp = A.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filter;
    osc.connect(lp); head = lp;
  }
  head.connect(g);
  const p = A.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
  g.connect(p); p.connect(A.bus);
  osc.start(t0); osc.stop(t0 + dur + .03);
}
function hiss({ dur = .18, vol = .1, at = 0, type = 'bandpass', f = 1800, q = 1, pan = 0, f2 = null }) {
  if (!A.on) return;
  const t0 = A.ctx.currentTime + at;
  const s = A.ctx.createBufferSource(); s.buffer = A.noise; s.loop = true;
  const bp = A.ctx.createBiquadFilter(); bp.type = type; bp.frequency.setValueAtTime(f, t0); bp.Q.value = q;
  if (f2) bp.frequency.exponentialRampToValueAtTime(Math.max(60, f2), t0 + dur);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + dur * .12);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(bp); bp.connect(g);
  const p = A.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
  g.connect(p); p.connect(A.bus);
  s.start(t0); s.stop(t0 + dur + .02);
}

/* ------------------------------------------------------------- generator hum */
/* the generator is never a loop you can point at: it is a rumble that follows distance */
function buildHum() {
  const ctx = A.ctx;
  const g = ctx.createGain(); g.gain.value = 0.0001; g.connect(A.master);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.connect(g);
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 48; o1.connect(lp);
  const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 96.5; o2.connect(lp);
  const s = ctx.createBufferSource(); s.buffer = A.noise; s.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = .6;
  const ng = ctx.createGain(); ng.gain.value = .25;
  s.connect(bp); bp.connect(ng); ng.connect(g);
  o1.start(); o2.start(); s.start();
  A.hum = { g, lp, o1, o2 };
}
function setHum(level) {
  if (!A.hum) return;
  // short time constant: walk away and it is gone in a breath, not a bar
  A.hum.g.gain.setTargetAtTime(clamp(level, .00001, .3), A.ctx.currentTime, .12);
  A.hum.lp.frequency.setTargetAtTime(200 + level * 1200, A.ctx.currentTime, .15);
}

/* ------------------------------------------------------------------ music */
/* A sparse lo-fi loop instead of a drone: chord stabs with real decay, a bass
   note, a shaker, a soft kick, and plenty of air between them.               */
const MUS = {
  step: 0, next: 0, bpm: 74,
  bars: [
    [220.0, 261.6, 329.6, 392.0],   // Am7
    [174.6, 220.0, 261.6, 329.6],   // Fmaj7
    [196.0, 246.9, 293.7, 349.2],   // G7-ish
    [130.8, 196.0, 261.6, 329.6],   // C
  ],
};
function musChord(t, freqs, vol = 1) {
  freqs.forEach((f, i) => {
    const o = A.ctx.createOscillator();
    o.type = i === 0 ? 'triangle' : 'sine';
    o.frequency.value = f;
    const g = A.ctx.createGain();
    const peak = (i === 0 ? .05 : .032) * vol;
    const dur = i === 0 ? 1.5 : 1.0;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + .014);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const lp = A.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = .4;
    o.connect(lp); lp.connect(g); g.connect(A.music);
    o.start(t); o.stop(t + dur + .05);
  });
}
function musBass(t, f, vol = 1) {
  const o = A.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
  const o2 = A.ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2;
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.075 * vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + .6);
  const g2 = A.ctx.createGain(); g2.gain.value = .12;
  const lp = A.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(A.music);
  o.start(t); o2.start(t); o.stop(t + .62); o2.stop(t + .62);
}
function musShaker(t, vol = 1) {
  const s = A.ctx.createBufferSource(); s.buffer = A.noise;
  const bp = A.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 6200; bp.Q.value = .9;
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.03 * vol, t + .006);
  g.gain.exponentialRampToValueAtTime(.0001, t + .06);
  s.connect(bp); bp.connect(g); g.connect(A.music);
  s.start(t); s.stop(t + .08);
}
function musKick(t, vol = 1) {
  const o = A.ctx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(96, t);
  o.frequency.exponentialRampToValueAtTime(44, t + .09);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.09 * vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + .2);
  o.connect(g); g.connect(A.music);
  o.start(t); o.stop(t + .22);
}
function startMusic() {
  MUS.next = A.ctx.currentTime + .15;
  MUS.step = 0;
}
/* called every frame; schedules a little ahead, never inside the callback */
function musicTick() {
  if (!A.on || A.muted || !A.musicOn || !A.ctx || A.ctx.state !== 'running') return;
  const now = A.ctx.currentTime;
  const stepDur = 60 / MUS.bpm / 2;                       // eighth notes
  if (MUS.next < now) MUS.next = now + .05;
  while (MUS.next < now + .3) {
    const s = MUS.step % 8;
    const bar = Math.floor(MUS.step / 8) % MUS.bars.length;
    const chord = MUS.bars[bar];
    const t = MUS.next;
    if (s === 0) { musChord(t, chord); musBass(t, chord[0] / 2); musKick(t, 1); }
    if (s === 3) musChord(t, chord, .7);
    if (s === 2 || s === 6) musShaker(t, s === 6 ? .9 : .55);
    if (s === 4) musBass(t, chord[0] / 2, .8);
    if (s === 6 && bar % 2 === 1) musChord(t, chord, .45);
    if (s === 5) musKick(t, .5);
    MUS.next += stepDur;
    MUS.step++;
  }
}

function register(group, id, label) {
  group.traverse(o => { if (o.isMesh) o.userData.interact = id; });
  group.userData.interact = id;
  group.userData.label = label;
  interact.push(group);
  return group;
}

/* Speech synthesis needs its voice list warmed up, and it needs picking by hand:
   lang="en-GB" alone silently does nothing on a machine with no en-GB voice. */
function warmVoices() {
  if (typeof speechSynthesis === 'undefined') return;
  const grab = () => {
    voice.voices = speechSynthesis.getVoices() || [];
    voice.best = pickVoice(voice.voices);
  };
  grab();
  speechSynthesis.addEventListener?.('voiceschanged', grab);
}
function pickVoice(vs) {
  if (!vs || !vs.length) return null;
  const score = v => {
    const n = (v.name + ' ' + v.voiceURI).toLowerCase();
    let s = 0;
    if ((v.lang || '').toLowerCase().startsWith('en-gb')) s += 6;
    else if ((v.lang || '').toLowerCase().startsWith('en')) s += 4;
    if (/daniel|arthur|george|oliver|graham|male|alex|fred/.test(n)) s += 3;
    if (/natural|neural|premium|enhanced|siri/.test(n)) s += 3;
    if (v.localService) s += 1;
    return s;
  };
  return vs.slice().sort((a, b) => score(b) - score(a))[0];
}
warmVoices();

/* Gerrit's message is a real recording (vendor/voicemail/N.mp3, 272 KB in total),
   played through the audio bus so mute and the room reverb apply to it too.       */
const VOICE_SRC = [1, 2, 3, 4, 5, 6].map(n => `./vendor/voicemail/${n}.mp3`);
const voiceBuf = {};
let voiceLoading = null;
function loadVoices() {
  if (!A.ctx) return Promise.resolve();
  if (voiceLoading) return voiceLoading;
  voiceLoading = Promise.all(VOICE_SRC.map(async (u, i) => {
    if (voiceBuf[i]) return;
    try {
      const r = await fetch(u);
      voiceBuf[i] = await A.ctx.decodeAudioData(await r.arrayBuffer());
    } catch (e) { voiceBuf[i] = null; }
  }));
  return voiceLoading;
}
function playClip(i, onEnd) {
  if (!A.ctx || !voiceBuf[i]) return false;
  const src = A.ctx.createBufferSource();
  src.buffer = voiceBuf[i];
  src.connect(A.bus);
  src.onended = onEnd;
  src.start();
  voice.clip = src;
  return true;
}
function playMessage() {
  if (speaking) return;
  audioInit();
  if (voice.clip) { try { voice.clip.stop(); } catch (e) {} voice.clip = null; }
  loadVoices();
  speaking = true;
  sfx.click();
  const tray = $('#tray');
  tray.hidden = false;
  kickerEl.textContent = 'answering machine';
  titleEl.textContent = 'One new message';
  amLed.material.emissiveIntensity = 3;
  let i = 0;
  voice.lines = []; voice.done = false; voice.spoke = false;
  sfx.click();                                    // the machine wakes up
  const next = () => {
    if (i >= MSG.length) {
      speaking = false;
      voice.done = true;
      state.hovered = { id: 'answer', label: 'Answering machine' };
      renderTray();
      amLed.material.emissiveIntensity = 1.4;
      if (!voice.spoke) setTimeout(() => toast('This browser has no speech voice — the transcript is on the left.', ''), 300);
      return;
    }
    const [rate, text] = MSG[i++];
    voice.lines.push(text);
    renderTray();
    if (playClip(i - 1, () => setTimeout(next, 260))) { voice.spoke = true; return; }
    const canSpeak = typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
    if (!canSpeak || !voice.voices.length) { setTimeout(next, 2600); return; }
    const u = new SpeechSynthesisUtterance(text);
    if (voice.best) { u.voice = voice.best; u.lang = voice.best.lang; } else u.lang = 'en-GB';
    u.rate = .92; u.pitch = .78; u.volume = 1;
    let started = false, advanced = false;
    const go = () => { if (advanced) return; advanced = true; setTimeout(next, 620); };
    u.onstart = () => { started = true; voice.spoke = true; };
    u.onend = go;
    u.onerror = go;
    voice.utt = u;                     // keep a reference: Chrome collects it otherwise
    try { speechSynthesis.cancel(); } catch (e) {}
    try { speechSynthesis.resume(); } catch (e) {}
    speechSynthesis.speak(u);
    // if the engine never starts, walk on with the subtitles instead of hanging
    setTimeout(() => { if (!started) go(); }, 1400 + text.length * 28);
  };
  next();
}

/* ------------------------------------------------------------ tray render */
/* Things a 1.6 m person cannot fiddle with. The crosshair ignores them until you are inside the case. */
const SMALL_ONLY = new Set(['led', 'bag', 'slotA2', 'slotB2', 'psuLabel', 'psuRocker', 'padlock', 'gpu', 'hpcie',
  'h24', 'hcpu', 'hfan', 'plugRear', 'chaFan1', 'sysFan3', 'cpuFanHdr', 'screwdriver', 'gpuDrum',
  'cable_atx', 'cable_eps', 'cable_pcie', 'cable_sata']);

function transcriptHTML() {
  if (!voice.lines.length) return '<p class="sub">a message is playing</p>';
  return voice.lines.map((t, i) => {
    const last = i === voice.lines.length - 1;
    const hot = last && !voice.done;
    return `<p class="${hot ? 'say' : 'sub'}" style="margin:.3em 0">${hot ? '▸ ' : ''}"${t}"</p>`;
  }).join('') + (voice.done ? '<p class="sub">— end of message —</p>' : '');
}

function renderTray() {
  if (speaking) {                       // the machine owns the tray while it talks
    trayEl.hidden = false;
    kickerEl.textContent = 'answering machine';
    titleEl.textContent = 'One new message';
    bodyEl.innerHTML = transcriptHTML();
    keysEl.innerHTML = 'playing — turn the sound up';
    state.trayTarget = 'answer';
    return;
  }
  if (state.gpu && state.gpu.trying) {
    trayEl.hidden = false;
    kickerEl.textContent = 'the hoist';
    titleEl.textContent = 'Padlock';
    bodyEl.innerHTML = comboBody();
    keysEl.innerHTML = '<kbd>↑↓</kbd>digit · <kbd>←→</kbd>wheel · <kbd>E</kbd>try it · <kbd>Q</kbd>let go';
    return;
  }
  if (state.grab) {
    trayEl.hidden = false;
    kickerEl.textContent = 'in your hands';

    const pct = Math.round((state.grab.p / state.grab.need) * 100);
    bodyEl.innerHTML = `<p>${state.grab.label}.</p><div class="bar"><i style="width:${clamp(pct, 0, 100)}%"></i></div>
      <p class="sub">${pct}% — keep dragging back.</p>`;
    keysEl.innerHTML = '<kbd>Q</kbd>let go';

  }
  const id = state.hovered && state.hovered.id;
  const t = id && THINGS[id];
  if (!t) { trayEl.hidden = true; state.trayTarget = null; return; }
  if (state.trayTarget !== id && state.reads) sfx.scratch();
  state.trayTarget = id;
  trayEl.hidden = false;
  kickerEl.textContent = t.kicker || '';
  titleEl.textContent = t.title || '';

/* ------------------------------------------------------------- interaction */
const raycaster = new THREE.Raycaster();
function currentTarget() {
  raycaster.far = P.reach;
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const hits = raycaster.intersectObjects(interact, true);
  for (const h of hits) {
    let o = h.object, id = null;
    while (o) { if (o.userData && o.userData.interact) { id = o.userData.interact; break; } o = o.parent; }
    if (id && SMALL_ONLY.has(id) && state.phase !== 'shrunk') continue;
    if (id) return { id, label: THINGS[id] ? THINGS[id].title : id };
  }
  return null;
}
function use() {
  const h = state.hovered;
  if (!h || !THINGS[h.id]) return;
  if (SMALL_ONLY.has(h.id) && state.phase !== 'shrunk') {
    sfx.nope();
    toast('You would need to be inside the case for that — about 17 mm tall.', 'bad');
    return;
  }
  const t = THINGS[h.id];
  if (t.act) t.act();
  renderTray();
}

/* --------------------------------------------------------------- movement */
const keys = new Set();
let yaw = 0, pitch = 0, feet = 0, vy = 0, grounded = true, stepAcc = 0;
HUMAN.r = 0.3; SHRUNK.r = 0.007;

const S = (x0, x1, y0, y1, z0, z1) => ({ x0, x1, y0, y1, z0, z1 });
const SOLID_H = [
  S(BENCH.x0, BENCH.x1, 0, BENCH.top, BENCH.z0, BENCH.z1),
  S(DESK.x0, DESK.x1, 0, DESK.top, DESK.z0, DESK.z1),
  S(COUNTER.x0, COUNTER.x1, 0, COUNTER.top, COUNTER.z0, COUNTER.z1),
  S(GEN.x - .40, GEN.x + .40, 0, .60, GEN.z - .30, GEN.z + .30),
  S(2.72, 3.08, 0, 1.35, 1.15, 1.55),
  S(ROOM.x0 - .5, ROOM.x0, 0, ROOM.h, -6, 4),
  S(ROOM.x1, ROOM.x1 + .5, 0, ROOM.h, -6, 4),
  S(-4, 4, 0, ROOM.h, ROOM.z1, ROOM.z1 + .5),
  S(-4, 2.05, 0, ROOM.h, ROOM.z0 - .5, ROOM.z0),
  S(2.85, 4, 0, ROOM.h, ROOM.z0 - .5, ROOM.z0),
  S(YARD.x0 - .5, YARD.x0, 0, YARD.h, -6.2, YARD.z1),
  S(YARD.x1, YARD.x1 + .5, 0, YARD.h, -6.2, YARD.z1),
  S(.9, 3.6, 0, YARD.h, YARD.z0 - .5, YARD.z0),
];
const SOLID_S = [
  S(TOWER.x - TOWER.w / 2 - .02, TOWER.x - TOWER.w / 2 + .02, .90, 1.95, TOWER.z - TOWER.d / 2, TOWER.z + TOWER.d / 2),
  S(TOWER.x + TOWER.w / 2 - .02, TOWER.x + TOWER.w / 2 + .02, .90, 1.95, TOWER.z - TOWER.d / 2, TOWER.z + TOWER.d / 2),
  S(TOWER.x - TOWER.w / 2, TOWER.x + TOWER.w / 2, .90, 1.95, TOWER.z - TOWER.d / 2 - .02, TOWER.z - TOWER.d / 2 + .02),
  S(TOWER.x - .14, TOWER.x + .02, .90, 1.20, TOWER.z - .31, TOWER.z - .16),
  S(BENCH.x0, BENCH.x0 + .02, .90, 1.60, BENCH.z0, BENCH.z1),
  S(BENCH.x1 - .02, BENCH.x1, .90, 1.60, BENCH.z0, BENCH.z1),
  S(BENCH.x0, BENCH.x1, .90, 1.60, BENCH.z0, BENCH.z0 + .02),
  S(BENCH.x0, BENCH.x1, .90, 1.60, BENCH.z1 - .02, BENCH.z1),
];

function resolve(pos, r, fY, h, list) {
  for (const s of list) {
    if (fY >= s.y1 - .002 || fY + h <= s.y0 + .002) continue;
    const cx = clamp(pos.x, s.x0, s.x1), cz = clamp(pos.z, s.z0, s.z1);
    const dx = pos.x - cx, dz = pos.z - cz;
    const d = Math.hypot(dx, dz);
    if (d > r) continue;
    if (d > 1e-6) { pos.x = cx + dx / d * r; pos.z = cz + dz / d * r; }
    else {
      const dl = pos.x - s.x0, dr = s.x1 - pos.x, db = pos.z - s.z0, df = s.z1 - pos.z;
      const m = Math.min(dl, dr, db, df);
      if (m === dl) pos.x = s.x0 - r;
      else if (m === dr) pos.x = s.x1 + r;
      else if (m === db) pos.z = s.z0 - r;
      else pos.z = s.z1 + r;
    }
  }
}

function move(dt) {
  const fast = keys.has('ShiftLeft') || keys.has('ShiftRight');
  const speed = P.speed * (fast ? 1.45 : 1);
  let fx = 0, fz = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) fz -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) fz += 1;
  if (keys.has('KeyA')) fx -= 1;
  if (keys.has('KeyD')) fx += 1;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  let nx = camera.position.x, nz = camera.position.z;
  if (fx || fz) {
    const len = Math.hypot(fx, fz);
    fx /= len; fz /= len;
    nx += (-sin * -fz + cos * fx) * speed * dt;
    nz += (-cos * -fz - sin * fx) * speed * dt;
  }
  const list = state.phase === 'shrunk' ? SOLID_S : SOLID_H;
  const pos = { x: nx, z: nz };
  resolve(pos, P.r, feet, P.eye * 1.06, list);
  const moved = Math.hypot(pos.x - camera.position.x, pos.z - camera.position.z);
  camera.position.x = pos.x;
  camera.position.z = pos.z;

  // gravity and a ground plane per scale
  const ground = state.phase === 'shrunk' ? BENCH.top : 0;
  vy -= (state.phase === 'shrunk' ? 1.8 : 9.8) * dt;
  feet += vy * dt;
  if (feet <= ground) { feet = ground; vy = 0; grounded = true; } else grounded = false;
  camera.position.y = feet + P.eye + (state.phase === 'shrunk' ? Math.sin(clock.elapsedTime * 6) * .00025 * (moved > 0 ? 1 : 0) : 0);

  if (moved > 1e-6) {
    stepAcc += moved;
    if (stepAcc > P.foot) { stepAcc = 0; sfx.step(state.phase !== 'shrunk'); }
  }
}

});
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;

  if (state.grab) { state.grab = null; renderTray(); return; }

});
document.addEventListener('pointerlockchange', () => {

  unlockHint.hidden = state.locked || state.won;
});
document.addEventListener('mousemove', e => {
  if (!state.locked) return;
  if (state.grab) {
    state.grab.p = clamp(state.grab.p + Math.max(0, e.movementY) + Math.max(0, e.movementX) * .4, 0, state.grab.need);
    if (state.grab.id === 'gpuDrum') {
      state.gpu.drop = clamp(state.grab.p / state.grab.need, 0, 1);
      if (Math.random() < .07) sfx.ratchet();
      renderTray();
      return;
    }
    if (state.grab.p >= state.grab.need) {
      const g = state.grab; state.grab = null;
      if (g.id === 'genCord') genPull();
      renderTray();
    } else renderTray();
    return;
  }
  const s = state.phase === 'shrunk' ? .0026 : .0021;
  yaw -= e.movementX * s;
  pitch = clamp(pitch - e.movementY * s, -1.35, 1.35);
  if (Math.abs(e.movementX) + Math.abs(e.movementY) > 6 && state.phase === 'shrunk') sfx.scratch();
});
addEventListener('keydown', e => {
  audioInit();
  if (state.gpu && state.gpu.trying) {
    e.preventDefault();
    const g = state.gpu;
    if (e.code === 'ArrowUp') { g.combo[g.sel] = (g.combo[g.sel] + 1) % 10; sfx.click(); renderTray(); }
    else if (e.code === 'ArrowDown') { g.combo[g.sel] = (g.combo[g.sel] + 9) % 10; sfx.click(); renderTray(); }
    else if (e.code === 'ArrowLeft') { g.sel = (g.sel + 2) % 3; renderTray(); }
    else if (e.code === 'ArrowRight') { g.sel = (g.sel + 1) % 3; renderTray(); }
    else if (e.code === 'KeyE') { tryCombo(); }
    else if (e.code === 'KeyQ' || e.code === 'Escape') { g.trying = false; renderTray(); }
    return;
  }
  if (e.code === 'KeyI' || e.code === 'Tab') { e.preventDefault(); togglePad(); return; }
  if (e.code === 'KeyM') {                       // music only: the room keeps its noises
    if (!A.ctx) audioInit();
    if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
    A.musicOn = !A.musicOn;
    if (A.music) A.music.gain.value = A.musicOn ? .35 : 0;
    if (A.musicOn) startMusic();
    else MUS.next = 0;
    toast(A.musicOn ? 'Music on' : 'Music off — effects stay', '');
    return;
  }
  if (e.code === 'KeyN') {                       // everything
    if (!A.ctx) audioInit();
    if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
    A.muted = !A.muted;
    if (A.master) A.master.gain.value = A.muted ? 0 : .85;
    if (!A.muted) { startMusic(); setTimeout(() => sfx.click(), 120); }
    toast(A.muted ? 'All sound off' : 'All sound on');
    return;
  }
  if (e.code === 'KeyH') { giveHint(); return; }
  if (e.code === 'KeyQ') {
    if (state.grab) { state.grab = null; renderTray(); }
    if (state.gpu && state.gpu.trying) { state.gpu.trying = false; renderTray(); }
    return;
  }
  if (e.code === 'Escape') {
    if (state.grab) { state.grab = null; renderTray(); }
    if (state.gpu && state.gpu.trying) { state.gpu.trying = false; renderTray(); }
    return;
  }
  if (e.code === 'KeyE') { use(); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (grounded && !shrinking && state.phase !== 'shrinking') { vy = P.jump; grounded = false; sfx.step(false); }
    return;
  }
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));

/* -------------------------------------------------------- generator pulls */
function genPull() {
  const g = state.gen;
  if (g.running) return;
  if (g.flooded) { sfx.cough(); toast('Still flooded. Three squeezes on the primer bulb.', 'bad'); return; }
  if (!g.fuel) { sfx.cough(); toast('It turns over once and dies. No fuel getting through.'); return; }
  if (g.choke !== 'closed') {
    sfx.cough(); g.flooded = 3; g.pulls = 0;
    toast('It floods — choke was open. Primer bulb, three times.', 'bad');
    return;
  }
  g.pulls++;
  sfx.cough();
  cordHandle.position.y = .46;
  setTimeout(() => { cordHandle.position.y = .40; }, 160);
  if (g.pulls >= 3) startGenerator();
  else toast(`Pull ${g.pulls} of 3.`);
}
function startGenerator() {
  const g = state.gen;
  g.running = true;
  g.choke = 'open';
  chokeLever.rotation.z = .9;
  sfx.roar(); setHum(.17);
  shopLight.intensity = 46;
  shopLight2.intensity = 34;
  benchLamp.intensity = 9;
  bulb.material.emissiveIntensity = 3.2;
  state.phase = 'lit';
  rayLed.material.emissive.setHex(0x59ff9a);
  rayLed.material.emissiveIntensity = 3;
  lens.material.emissiveIntensity = 1.6;
  padRing.material.opacity = .45;

  setTimeout(() => toast('Lights, relay, and the case is already complaining.', 'good'), 700);
}

/* ------------------------------------------------------------------ hints */
function giveHint() {
  if (!state.gen.running && !state.torch) return toast('Hint · it is dark. The torch is on the counter, blinking green.', '');
  if (!state.gen.running) return toast('Hint · the generator, back yard. Fuel open, choke closed, three pulls on the cord.', '');
  if (state.phase !== 'shrunk') return toast('Hint · stand in the ring on the floor and pull the shrink ray lever.', '');
  if (!state.ram.a2) return toast('Hint · slot A2: that module is leaning out of the socket. Push it home.', '');
  if (!state.ram.seated) {
    if (!state.ram.b2Out) return toast('Hint · C1 is still up. Pull the scorched module out of B2.', '');
    if (!state.ram.spare) return toast('Hint · the sealed bag beside the slots is labelled SPARE > B2.', '');
    return toast('Hint · seat the spare in B2. The scorched one is scrap.', '');
  }
  if (!state.psu.rocker) return toast('Hint · the PSU rocker, on the power unit by the case opening.', '');
  if (!state.psu.atx || !state.psu.cpu) return toast('Hint · 24-pin to the board, then the EPS 8-pin. Pick a cable end up first, then the socket.', '');
  if (!fanDone()) {
    if (state.fans.rear !== true && state.held !== 'fan4') return toast('Hint · the rear fan plug is lying by the back wall. Pick it up, then CHA_FAN1.', '');
    if (!state.fans.cpu) return toast('Hint · the CPU fan cable is in SYS_FAN3. Pull it and move it to CPU_FAN.', '');
    return toast('Hint · a screwdriver is jammed in the intake fan.', '');
  }
  if (!state.gpu.unlocked) return toast('Hint · the padlock takes the last three digits of the shop number on the side panel.', '');
  if (state.gpu.drop < .92) return toast('Hint · grab the winch drum and drag back.', '');
  if (!state.gpu.seated) return toast('Hint · the card is at the rail. Push it in.', '');
  if (!state.gpu.powered) return toast('Hint · the card wants its own 8-pin. The PCIe one.', '');
  return toast('Hint · C1, F1 and d4 are clear. Slices 3-5 build the rest.', 'good');
}

/* --- the three fans ----------------------------------------------------- */
function makeFan(x, y, z, r, facing) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  scene.add(g);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, .004, 6, 18), M.metalDark);
  g.add(ring);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * .22, r * .22, .008, 10), M.plastic);
  hub.rotation.x = Math.PI / 2;
  g.add(hub);
  const blades = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(r * .78, .002, r * .28), new THREE.MeshStandardMaterial({ color: 0x1a1e21, roughness: .8 }));
    b.position.set(Math.cos(i / 5 * 6.283) * r * .45, 0, Math.sin(i / 5 * 6.283) * r * .45);
    b.rotation.y = -i / 5 * 6.283;
    blades.add(b);
  }
  // a square shroud, so a fan reads as a fan and not as a loose hoop
  const s = r * 2.2, t = r * .17;
  [[0, r * 1.1, s, t], [0, -r * 1.1, s, t], [r * 1.1, 0, t, s], [-r * 1.1, 0, t, s]].forEach(([bx, by, bw, bh]) => {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, .012), M.metalDark);
    bar.position.set(bx, by, -.004);
    g.add(bar);
  });
  g.add(blades);
  if (facing === 'up') g.rotation.x = -Math.PI / 2;
  if (facing === 'side') g.rotation.y = Math.PI / 2;
  return { g, blades };
}

const railLive = () => state.psu.rocker && state.psu.atx && state.psu.cpu;
const fanDone = () => state.fans.rear && state.fans.cpu && state.fans.intake;

function clearCode(c, note, key, msg) {
  if (!state.codes.includes(c)) return;
  state.codes = state.codes.filter(x => x !== c);
  if (note) state.notes[key] = note;
  renderPad();
  toast(msg, 'good');
}
function checkRam() {
  if (!state.ram.a2 || !state.ram.seated) return;
  if (!state.codes.includes('C1')) return;
  state.codes = state.codes.filter(c => c !== 'C1');
  state.notes.RAM = 'B';
  renderPad();
  toast('Both modules home. C1 drops out of the cycle, and the sticker gives up a B.', 'good');
}
function checkFans() {
  if (!fanDone() || !railLive() || state.fans.spinning) return;
  state.fans.spinning = true;
  sfx.spin();
  clearCode('F1', 'O', 'fans', 'All three spin. F1 drops out of the cycle.');
}
function checkGpu() {
  if (state.gpu.seated && state.gpu.powered && railLive()) {
    clearCode('d4', 'K', 'GPU', 'The card posts. d4 is gone.');
  }
}

/* --- plugging cables --------------------------------------------------- */
function plug(dest) {
  const need = { h24: 'atx', hcpu: 'eps', hfan: 'sata', hpcie: 'pcie' }[dest];
  const label = { h24: 'the 24-pin socket', hcpu: 'the CPU power socket', hfan: 'the fan hub', hpcie: 'the card' }[dest];
  if (dest === 'h24' && state.psu.atx) { toast('Already in.'); return; }
  if (dest === 'hcpu' && state.psu.cpu) { toast('Already in.'); return; }
  if (dest === 'hfan' && state.psu.sata) { toast('Already in.'); return; }
  if (dest === 'hpcie' && state.psu.pcie) { toast('Already in.'); return; }
  if (!state.held) {
    sfx.nope();
    toast('Your hands are empty. Pick up a cable end first.');
    return;
  }
  if (state.held !== need) {
    sfx.buzz();
    const wrong = CABLE[state.held].name;
    if ((state.held === 'eps' && dest === 'hpcie') || (state.held === 'pcie' && dest === 'hcpu')) {
      toast('Those two 8-pins are the same plug. This one goes in the other socket — read the label.', 'bad');
    } else {
      toast(`A ${wrong} will not go into ${label}.`, 'bad');
    }
    return;
  }
  if (dest === 'hcpu' && !state.psu.atx) {
    sfx.buzz(); toast('Nothing there yet — the board is not even on 24-pin.', 'bad'); return;
  }
  if (!state.psu.rocker) {
    sfx.buzz(); toast('Dead. The rocker on the PSU is still off.', 'bad'); return;
  }
  state.psu[need === 'atx' ? 'atx' : need === 'eps' ? 'cpu' : need] = true;
  state.held = null;
  cableMesh[need].visible = false;
  box(need === 'atx' ? .030 : .018, .012, .012,
    new THREE.MeshStandardMaterial({ color: 0x2a2f33, roughness: .7 }),
    dest === 'h24' ? -1.82 : dest === 'hcpu' ? -2.06 : dest === 'hfan' ? -1.92 : -.07,
    B2 + .014, dest === 'h24' ? -2.36 : dest === 'hcpu' ? -2.42 : dest === 'hfan' ? -2.56 : 0);
  sfx.snap();
  if (need === 'atx' || need === 'eps') {
    setTimeout(() => sfx.relay(), 120);
    if (railLive() && !state.notes.PSU) {
      state.notes.PSU = 'R';
      renderPad();
      setTimeout(() => toast('12 V on the board. The fans have power to waste.', 'good'), 260);
    }
  }
  if (need === 'pcie') { state.gpu.powered = true; checkGpu(); }
  if (need === 'sata') checkFans();
  renderPad();
}

function comboBody() {

  const digits = g.combo.map((d, i) => `<b style="color:${i === g.sel ? '#ffd166' : '#cfe6ee'}">${d}</b>`).join('');
  return `<p>Three brass wheels, stiff with grease.</p>
    <p style="font-size:1.3rem;letter-spacing:.35em">${digits}</p>
    <p class="sub">${g.sel + 1} of 3 selected. The shop number is on the side panel of the case.</p>`;
}
function tryCombo() {
  const g = state.gpu;
  if (g.combo.join('') === '456') {
    g.unlocked = true; g.trying = false;
    padlock.visible = false;
    sfx.pop();
    setTimeout(() => sfx.chime(), 160);
    toast('The shackle pops. The drum is free.', 'good');
    renderTray();
  } else {
    sfx.buzz();
    g.combo = [0, 0, 0]; g.sel = 0;
    toast('Nothing. It resets.', 'bad');
    renderTray();
  }
}

/* --- per-frame animation ----------------------------------------------- */
function slice2Tick(dt, t) {
  const yC = state.gpu.seated ? GPU.seatY : GPU.hangY + (GPU.seatY - GPU.hangY) * state.gpu.drop;
  gpuGroup.position.set(HOIST.x, yC, HOIST.z);
  const topY = B2 + .95;
  const ropeTo = yC + GPU.h / 2;
  const h = Math.max(.02, topY - ropeTo);
  gpuRope.scale.y = h;
  gpuRope.position.set(HOIST.x, (topY + ropeTo) / 2, HOIST.z);
  gpuRope.visible = !state.gpu.seated;
  const spin = state.fans.spinning ? 1 : 0;
  const w = t * 9 * spin;
  if (spin) {
    fanRear.blades.rotation.z = w; fanIn.blades.rotation.z = w; fanCpu.blades.rotation.z = w;
  }
  if (state.gpu.trying) { /* tray already drawn by renderTray */ }
}

/* ------------------------------------------------------------------- loop */
const clock = new THREE.Clock();
let hoverT = 0, humT = 0;
drawLed(null);
renderPad();

function tick() {
  const dt = Math.min(clock.getDelta(), .1);   // slow machines should not crawl
  const t = clock.elapsedTime;

  if (state.running && state.locked && state.phase !== 'shrinking') move(dt);
  camera.rotation.set(pitch, yaw, 0);

  // music chord every 3.6 s
  musicTick();

  // the generator is louder when you are near it
  humT -= dt;
  if (humT <= 0 && A.on) {
    humT = .18;
    if (state.gen.running) {
      // inverse square, with no floor: the generator is loud in the yard and gone indoors
      const d = Math.hypot(camera.position.x - GEN.x, camera.position.z - GEN.z);
      setHum(.17 / (1 + d * d * 1.15));
    }
  }

  // the debug display cycles every fault in turn
  if (ledOn) {
    state.codeT += dt;
    if (state.codeT > 2) {
      state.codeT = 0;
      state.codeIndex = (state.codeIndex + 1) % Math.max(1, state.codes.length);
      drawLed(state.codes.length ? state.codes[state.codeIndex] : '--');
    }
  }

  // torch sway
  if (state.torch) {
    torchLight.target.position.set(Math.sin(t * .7) * .06, Math.sin(t * 1.1) * .05, -1);
    torchLight.intensity = 24 + Math.sin(t * 9) * 1.2 + Math.sin(t * 23) * .6;
  }
  if (!state.torch) torchPin.material.emissiveIntensity = 1.2 + (Math.sin(t * 2.6) > .3 ? 2.4 : 0);
  if (state.gen.running) {
    shopLight.intensity = 46 + Math.sin(t * 17) * 1.6 + Math.sin(t * 41) * .8;
    shopLight2.intensity = 34 + Math.sin(t * 13 + 2) * 1.2;
    benchLamp.intensity = 9 + Math.sin(t * 19) * .5;
    amLed.material.emissiveIntensity = 1.2 + Math.sin(t * 2.2) * .9;
  }

  // hover check
  hoverT -= dt;
  if (hoverT <= 0) {
    hoverT = .07;
    state.hovered = currentTarget();
    if (state.hovered) {
      crosshair.classList.add('hot');
      crosshair.classList.toggle('grab', !!state.grab);
      const th = THINGS[state.hovered.id];
      const acts = th && th.keys ? th.keys() : '';
      const actionable = /<kbd>E<\/kbd>/.test(acts);
      promptEl.innerHTML = actionable ? `<kbd>E</kbd>${state.hovered.label}` : state.hovered.label;
      promptEl.classList.toggle('read', !actionable);
      promptEl.hidden = false;
    } else {
      crosshair.classList.remove('hot');
      promptEl.hidden = true;
    }
    const id = state.hovered ? state.hovered.id : null;
    if (id !== state.trayTarget) renderTray();
  }
  if (state.grab) crosshair.classList.add('grab'); else crosshair.classList.remove('grab');

  if (state.running && state.phase !== 'shrinking') {
    state.elapsed += dt;
    const s = Math.floor(state.elapsed);
    timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }

  slice2Tick(dt, t);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

/* ------------------------------------------------------------------ start */
camera.position.set(0.25, 1.62, 2.6);
yaw = 0.12; pitch = -.10;
setTimeout(() => toast('Dark shop, dead meter, one tower on the bench.', ''), 500);
setTimeout(() => toast('Something on the floor is reflecting your eye.', ''), 3200);

/* -------------------------------------------------- test hook (?debug|?test) */
if (new URLSearchParams(location.search).has('debug') || new URLSearchParams(location.search).has('test')) {
  window.__doctor = {
    state, THINGS, sfx, drawLed, use, currentTarget, genPull, pullLever, doShrink, startGenerator, giveHint,
    interact, camera, scene, THREE, raycaster, ledCanvas, ledCtx, ledTexture, ledMat, led, A, audioInit,
    setFeet(f) { feet = f; camera.position.y = f + P.eye; },
    look(y, pi) { yaw = y; pitch = pi; camera.rotation.set(pitch, yaw, 0); },
    aimAt(id, dist = 1.1, fy = null, at = null) {
      const cands = interact.filter(o => o.userData.interact === id);
      if (!cands.length) return null;
      if (fy != null) feet = fy;
      let out = null;
      const approaches = at ? [[at[0], at[1]]] : [
        [0, 1], [0, -1], [1, 0], [-1, 0],        // front, behind, right, left
      ];
      for (const g of cands) {
        const bb = new THREE.Box3().setFromObject(g);
        const mid = bb.getCenter(new THREE.Vector3());
        for (const [ax, az] of approaches) {
        const px = at ? at[0] : mid.x + ax * dist, pz = at ? at[1] : mid.z + az * dist;
        camera.position.set(px, feet + P.eye, pz);
        const c = bb.containsPoint(camera.position) ? mid
          : bb.clampPoint(camera.position.clone(), new THREE.Vector3()).lerp(mid, .3);
        const dx = c.x - px, dz = c.z - pz, dy = c.y - (feet + P.eye);
        const flat = Math.hypot(dx, dz) || 1e-6;
        yaw = Math.atan2(-dx, -dz);
        pitch = Math.atan2(dy, flat);
        camera.rotation.set(pitch, yaw, 0);
        camera.updateMatrixWorld(true);
        const hit = currentTarget();
        if (hit) { out = hit.id; break; }
        }
        if (out) break;
      }
      state.hovered = out ? { id: out, label: THINGS[out] ? THINGS[out].title : out } : null;
      renderTray();
      return out;
    },
    aim(x, z, yawV = 0, pitchV = null, fy = null) {
      if (fy != null) { feet = fy; }
      camera.position.set(x, feet + P.eye, z);
      yaw = yawV;
      const tries = pitchV == null ? [0, -.1, -.2, -.3, -.45, -.7, -.95, -1.2, .1, .2, .35, .6] : [pitchV];
      let hit = null;
      for (const p of tries) {
        pitch = p; camera.rotation.set(p, yaw, 0); camera.updateMatrixWorld(true);
        hit = currentTarget(); if (hit) break;
      }
      state.hovered = hit; renderTray();
      return hit ? hit.id : null;
    },
    get P() { return P; },
  };
}
